<!DOCTYPE html>

<style>
/* =============================
   カラートークン
============================= */
:root {
  --frame-color: #6a5142;
  --bg-washi: #fbfaf7;
  --ink-black: #0b0b0b;
  --text-white: #ffffff;
  --led-green: #3cff6a;
}

#loadingScreen {
  position: fixed;
  inset: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.2rem;
  z-index: 20000;
}



/* =============================
   全体
============================= */
/* =============================
   全体スクロール修正
============================= */
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow-y: auto;   /* ← 全体スクロールを有効に */
  -webkit-overflow-scrolling: touch; /* スマホ滑らかスクロール */
}

body {
  background: var(--bg-washi);
  color: #222;
  font-family: "Hiragino Mincho ProN","Yu Mincho",serif;
}

.cookie {
  background: #fff;
  border: 1.5px solid var(--frame-color);
  border-radius: 6px;
  padding: 10px;
  overflow: visible;  /* ← auto や hidden は避ける */
}

/* =============================
   電光掲示板レイアウト
============================= */
#board {
  margin-top: 16px;
  font-family: 'Courier New', monospace;
  color: #000;
}

/* ===== PC基本 ===== */
.board-head,
.board-row {
  display: grid;
  grid-template-columns:
    56px       /* ラベル */
    96px       /* 開始時刻 */
    72px       /* 所要時間 */
    minmax(260px, 1fr); /* 作品名 */
  gap: 6px;
  align-items: center;
}

/* ヘッダー */
.board-head {
  font-weight: bold;
  border-bottom: 1px solid #ccc;
  padding-bottom: 6px;
  background: #fff;
}

/* ラベル */
.label {
  text-align: center;
  font-weight: bold;
  background: #fff;
}

.vertical-line {
  width: 1px;
  background: #ccc;
  height: 100%;
  margin: 0 4px;
}


/* =============================
   フリップセル（共通・1セル1行）
============================= */
.outer {
  position: relative;
  height: 2.2em;
  background: #000;
  overflow: hidden;
  perspective: 800px;
  border-radius: 4px;
}

/* フリップ本体 */
.flap {
  position: absolute;
  inset: 0;
  background: linear-gradient(#222, #111, #222);
  color: #fff;
  font-weight: bold;
  text-align: center;
  white-space: nowrap;
  backface-visibility: hidden;
}

/* メイン面 */
.flap.main {
  display: flex;
  align-items: center;  /* 縦中央 */
  justify-content: center; /* 横中央 */
  height: 100%;
  font-weight: bold;
}


/* 上下フラップ（参考コード完全準拠） */
/* 上下フラップ */
.flap.top,
.flap.bottom {
  clip-path: polygon(0 0,100% 0,100% 50%,0 50%);
  /* display: none; ← フリップ中は JS 側で制御するので初期非表示は ok */
  
  display: flex;                /* 追加 */
  align-items: center;          /* 縦中央 */
  justify-content: center;      /* 横中央 */
  height: 50%;                  /* 上下それぞれ半分 */
  font-family: inherit;          /* main と同じフォント */
  font-size: inherit;            /* main と同じサイズ */
  line-height: inherit;          /* main と同じ高さ */
  font-weight: inherit;          /* main と同じ太さ */
}

.flap.top {
  clip-path: polygon(0 0,100% 0,100% 50%,0 50%);
  display: none;
}

.flap.bottom {
  clip-path: polygon(0 50%,100% 50%,100% 100%,0 100%);
  display: none;
}

/* =============================
   数字用フリップ
============================= */
.flap.main,
.flap.top,
.flap.bottom {
  font-family: "Microsoft YaHei", sans-serif; /* 数字用フォント */
  line-height: 2.2em;  /* 高さに合わせて縦中央揃え */
  font-weight: bold;
  text-align: center;
  font-size: 1rem;     /* main と同じサイズ */
}

/* 境界線 */
.gap {
  position: absolute;
  top: 50%;
  width: 100%;
  height: 1px;
  background: #000;
  opacity: .6;
  z-index: 20;
}

/* =============================
   時刻・所要時間
============================= */
.time-wrapper {
  display: flex;
  align-items: center;
  height: 2.2em;          /* ← outerと完全一致させる */
  line-height: 2.2em;     /* ← baselineズレ防止 */
  gap: 4px;
}

/* 時刻 */
.time-wrapper .outer {
  width: 2.6ch;
}

/* 所要時間（3桁想定） */
.outer.duration {
  width: 3.6ch;
  height: 2.6em;          /* 明示 */
  margin-top: 0;
  margin-bottom: 0;
  align-self: center;   /* ← flex内で明示 */
}

.colon,
.unit {
  font-weight: bold;
  color: #000;
}

.unit {
  display: inline-flex;   /* ← inline をやめる */
  align-items: center;    /* ← 縦中央固定 */
  height: 2.2em;          /* ← outerと同じ */
  line-height: 2.2em;
}


/* =============================
   作品名（完全1行制御）
============================= */
.outer.title {
  height: 2.2em;
  background: #000;
  position: relative;
  overflow: hidden;
}

/* フリップ用（短文） */
.flap.title-cell {
  line-height: 2.2em;
  font-family: "BIZ UDPゴシック", sans-serif;
  font-weight: bold;
  text-align: center;
  font-size: 1rem;     /* main と同じサイズ */
}

/* スクロール用（長文） */
.title-scroll {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  overflow: hidden;
  color: #fff;
  font-family: "BIZ UDPゴシック", sans-serif;
  font-size: 0.95rem;
}

.title-scroll span {
  white-space: nowrap;
  animation: scrollText 12s linear infinite;
}

/* 切替 */
.outer.title.show-scroll .flap-container {
  display: none;
}
.outer.title.show-scroll .title-scroll {
  display: flex;
}

/* =============================
   フリップ中ブラックアウト
============================= */
.outer.black .flap {
  background: #000;
  color: transparent;
}



/* =============================
   備考スクロール（完全版）
============================= */
/* 備考行全体を1行分の高さに */
.board-notes {
  display: grid;
  grid-template-columns: 56px 1fr;
  align-items: center;
  margin-top: 6px;
}

.board-notes .scroll {
  background: #000;               /* 黒背景 */
  color: #00ff66;                 /* LEDグリーン */
  padding: 0.3em 0.6em;
  border-radius: 4px;
  font-family: "BIZ UDPゴシック", sans-serif;
  height: 2.2em;                  /* フリップセルと同じ */
  line-height: 2.2em;             /* 縦中央揃え */
  box-sizing: border-box;
  
  position: relative;              /* 基準 */
  overflow: hidden;
  display: flex;
  align-items: center;
}

/* 横スクロール用 span */
.board-notes .scroll span {
  position: absolute;
  left: 0;
  transform: translateX(var(--start-x));
  display: inline-block;
  font-family: "BIZ UDPゴシック", sans-serif;
  white-space: nowrap;
  will-change: transform;
  animation-name: scrollText;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-duration: var(--scroll-duration, 15s);
}

/* 赤点滅モード */
.board-notes .scroll.red span {
  color: red;
  font-weight: bold;
  animation: blinkRed 1s step-start infinite;
}

/* =============================
   アニメーション
============================= */
@keyframes scrollText {
  from { transform: translateX(var(--start-x)); }
  to   { transform: translateX(var(--end-x)); }
}

@keyframes blinkRed {
  50% { opacity: 0; }
}

/*==============================
    TTbutton
==============================*/
.tt-btn {
  border-radius: 999px;
  padding: 6px 14px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.tt-btn.enabled {
  background: #000;
  color: #fff;
}

.tt-btn.disabled {
  background: #999;
  color: #fff;
  cursor: default;
}
#timetableHeader {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  margin-bottom: 8px;
}

#ttDate {
  text-align: center;
  font-weight: bold;
  font-size: 1.1rem;
}


/* =============================
   タイムテーブル罫線
============================= */
#timetable {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  table-layout: fixed;   /* ★ 追加 */
}

#timetable th,
#timetable td {
  border: 1px solid #999;
  padding: 6px 8px;
  font-family: "BIZ UDPゴシック", sans-serif;
  font-size: 0.95rem;
}
#timetable th:nth-child(1),
#timetable td:nth-child(1) { width: 50px; }

#timetable th:nth-child(2),
#timetable td:nth-child(2) { width: 80px; }

#timetable th:nth-child(3),
#timetable td:nth-child(3) { width: 90px; }

#timetable th:nth-child(5),
#timetable td:nth-child(5) { width: 60px; }

#timetable thead th {
  background: #f2f2f2;
  font-weight: bold;
}

#timetable tbody tr:nth-child(even) {
  background: #fafafa;
}

/* 作品名はクリックできると分かるように */
.tt-title {
  cursor: pointer;
  text-decoration: underline;
}

/* =============================
   モーダル全体
============================= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

/* 非表示 */
.hidden {
  display: none !important;
}
.modal.hidden {
  display: none;
}

.modal-content{
  background: #ffffff;
  border-radius: 28px;
  padding: 20px;
  width: 90%;
  max-width: 420px;

  max-height: 92vh;
  display: flex;
  flex-direction: column;

  box-shadow: 0 6px 15px rgba(0,0,0,.25);
}

.modal-body{
  flex: 1;                 /* ← ここ重要 */
  overflow-y: auto;
  overscroll-behavior: contain;
  margin: 10px 0 12px;
  -webkit-overflow-scrolling: touch;
}



/* ===== 戻るボタン（下固定） ===== */
.modal-back{
  width: 100%;
  padding: 12px;
  border: none;
  background: #1b1b1b;
  color: #fff;
  font-weight: bold;
  font-size: 16px;
  border-radius: 20px;
  cursor: pointer;

  flex-shrink: 0;

  box-shadow:
    0 6px 10px rgba(0,0,0,.15),
    inset 0 3px 5px rgba(255,255,255,.35);
  transition: transform .1s ease, box-shadow .2s ease;
}

.modal-back:hover{
  transform: translateY(-2px);
  box-shadow:
    0 8px 14px rgba(0,0,0,.2),
    inset 0 3px 5px rgba(255,255,255,.45);
}

.modal-back:active{
  transform: translateY(0);
}

#modalClose {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 20px;
  background: none;
  border: none;
  cursor: pointer;
}


.zoom-close{
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 10;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
}

/* 拡大していない時は非表示 */
.zoom-close.hidden{
  display: none;
}

/* モーダル画像 通常 */
/* 通常状態 */
#modalImage {
  max-width: 100%;
  height: auto;
  margin-top: 10px;
  border-radius: 6px;
  cursor: zoom-in;
  transition: transform 0.3s ease;
}

/* ===== 拡大状態 ===== */
#modalImage.zoomed {
  position: fixed;          /* ← 画面基準にする（最重要） */
  top: 50%;
  left: 50%;
  transform:
    translate(-50%, -50%)   /* ← 画面中央へ */
    scale(2);               /* ← 拡大率 */
  max-width: none;          /* ← 枠制限解除 */
  max-height: none;
  z-index: 30000;           /* ← モーダルより前面 */
  cursor: zoom-out;
}

/* 閉じるボタンはさらに上 */
.zoom-close{
  position: fixed;   /* ← absoluteではなくfixed */
  top: 20px;
  right: 20px;
  z-index: 40000;    /* ← 画像より上 */
}

/* 掴み中 */
#modalImage.zoomed:active {
  cursor: grabbing;
}


/*============================
リンクエリア
============================*/
/* 下部リンク（カレンダー直下表示） */
.link-area{
  display: flex;
  flex-wrap: wrap;            /* 折り返し許可 */
  grid-template-columns: repeat(3, 1fr); /* ← 3列固定 */
  margin: 12px 15px 0;
  padding: 10px 0;
  gap: 10px;
  justify-content:center;
  overflow: visible;   /* 親のスクロールを阻害しない */
}.link-area a {
  flex: 1 1 calc(33.333% - 10px); /* 3列化 */
  text-align: center;
}

.link-area button{
  flex: 1 1 120px;
  border:none;
  border-radius: 18px;
  padding: 10px 14px;
  background: #1b1b1b;
  color:#fff;
  font-weight: 800;

}
.action-button {

  background-color: #1b1b1b;
  color: #fff;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  transition: transform 0.1s ease;
}

.action-button:hover {
  transform: translateY(-2px);

}


.badge {
  display: inline-block;

}

.badge-new {

}

.badge-archive {

}

.duration {

}

#modalPdf {
  width: 100%;
  height: 60vh;
  border: none;
}

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:50000;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

.close-btn{
  position:absolute;
  top:25px;
  right:35px;
  font-size:32px;
  color:white;
  cursor:pointer;
  opacity:0.7;
  transition:all .2s ease;
  font-weight:300;
  letter-spacing:2px;
  z-index: 50001;   /* ← 追加 */
}

.close-btn:hover{
  opacity:1;
  transform:scale(1.2);
}





/* =============================
   📱 スマホ対応
============================= */
@media (max-width: 640px) {

    .board-head {
    grid-template-columns:
      48px  /* ラベル */
      72px  /* 開始時刻 */
      60px  /* 所要時間 */
      1fr;  /* 作品名 */
    gap: 4px;
  }

  /* PCと同じ1行構成を維持 */
  .board-row {
    grid-template-columns:
      48px        /* ラベル */
      72px        /* 開始時刻 */
      60px        /* 所要時間 */
      1fr;        /* 作品名 */
    gap: 4px;
    height: 2.2em;          /* ← これが決定打 */
    align-items: stretch;
  }

  /* フォント微調整 */
  .outer {
    height: 2em;
  }

  .flap {
    font-size: 0.9rem;
  }

  .outer.title {
    font-size: 0.9rem;
  }
    #timetableWrapper {
    overflow-x: auto;
  }
  #timetable th,
  #timetable td {
    font-size: 0.85rem;
    padding: 4px 6px;
    white-space: normal;  /* ← 作品名だけ折り返し可能に */
  }

  /* 作品名のみ2行まで許可 */
  #timetable td:nth-child(4) { 
    display: -webkit-box;
    -webkit-line-clamp: 2;  /* 最大2行 */
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* その他列は1行固定 */
  #timetable td:not(:nth-child(4)) {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* テーブル下に固定備考 */
  #ttNotes {
    margin-top: 8px;
    padding: 6px 8px;
    font-size: 0.85rem;
    background: #fafafa;
    border-top: 1px solid #ccc;
  }

  /* 注意文はその下1行 */
  #ttNotes p:last-child {
    margin-top: 4px;
  }

  /* 備考は縦積みしない */
  .board-notes {
    grid-template-columns: 48px 1fr;
  }

  .notes-scroll {
    font-size: 0.9rem;
  }
  .board-notes .scroll {
    height: 2em;
    line-height: 2em;
    font-size: 0.9rem;
    padding: 0.2em 0.4em;
  }

  .modal{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;        /* ← これを必ず入れる */

  justify-content: center;
  align-items: flex-end;   /* ← center → flex-end */

  padding-bottom: 16px;    /* ← 下余白 */

  z-index: 9999;
  }

  .modal-content {
    width: 94vw;
    max-height: 90vh;
    padding: 14px;
  }

  #modalTitle {
    font-size: 1.1rem;
  }

  #modalDesc {
    font-size: 0.95rem;
  }

}


</style>

function safe2(v) {

// =============================
// フリップ（参考コード完全準拠）
// =============================
async function flipFlap(el, nextText, duration = 100) {
  const main = el.querySelector('.flap.main');
  const top = el.querySelector('.flap.top');
  const bottom = el.querySelector('.flap.bottom');

  top.textContent = nextText;
  top.style.display = bottom.style.display = 'block';

  main.style.zIndex = 11;
  bottom.style.zIndex = 12;
  top.style.zIndex = 10;

  let anim = main.animate([{ transform: 'rotateX(-90deg)' }], { duration });
  await anim.finished;

  main.style.transform = 'rotateX(90deg)';
  main.textContent = nextText;

  main.style.zIndex = 11;
  bottom.style.zIndex = 10;
  top.style.zIndex = 12;

  anim = main.animate([{ transform: 'rotateX(0deg)' }], {
    duration,
    fill: 'forwards'
  });
  await anim.finished;

  bottom.textContent = nextText;
  top.style.display = bottom.style.display = 'none';
}

// =============================
// 数字フリップ
// =============================
async function flipNumber(el, from, to, step, durationMs) {
  const end = Date.now() + durationMs;
  let v = from;

  while (Date.now() < end && v <= to) {
    await flipFlap(el, safe2(v));
    v += step;
  }
  setCellText(el, safe2(to));
}

async function spinRandomTitlesSteps(el, totalSteps) {
  if (!worksList || !worksList.length) return;

  // 回転中はスクロール無効
  el.classList.remove('show-scroll');

  const top = flapContainer.querySelector('.flap.top');
  const bottom = flapContainer.querySelector('.flap.bottom');

  for (let i = 0; i < totalSteps; i++) {
    const title = worksList[Math.floor(Math.random() * worksList.length)];

    // 上フラップに次のタイトルをセットして表示
    top.textContent = title;
    top.style.display = bottom.style.display = 'block';

    flap.style.zIndex = 11;
    bottom.style.zIndex = 12;
    top.style.zIndex = 10;

    // 回転アニメーション（上半分折りたたみ）
    let anim = flap.animate([{ transform: 'rotateX(-90deg)' }], { duration: FLIP_MS });
    await anim.finished;

    flap.style.transform = 'rotateX(90deg)';
    flap.textContent = title;

    flap.style.zIndex = 11;
    bottom.style.zIndex = 10;
    top.style.zIndex = 12;

    // 回転戻し
    anim = flap.animate([{ transform: 'rotateX(0deg)' }], { duration: FLIP_MS, fill: 'forwards' });
    await anim.finished;

    bottom.textContent = title;
    top.style.display = bottom.style.display = 'none';
  }
}

function setTitle(el, text) {
  const isLong = text.length > 14;

  const flap = el.querySelector('.flap.main.title-cell');
  const scroll = el.querySelector('.title-scroll span');

  el.classList.toggle('show-scroll', isLong);

  if (isLong) {
    flap.textContent = '';
    scroll.textContent = text;

    const boxWidth = el.offsetWidth;
    const textWidth = scroll.offsetWidth;

    if (textWidth <= boxWidth) return; // 長さ不足ならスクロール不要

    const speed = 60; // px/sec
    const distance = boxWidth + textWidth;
    const duration = distance / speed;

    scroll.style.setProperty('--start-x', `${boxWidth}px`);
    scroll.style.setProperty('--end-x', `-${textWidth}px`);
    scroll.style.setProperty('--scroll-duration', `${duration}s`);
    scroll.style.animation = `scrollText var(--scroll-duration) linear infinite`;
  } else {
    flap.textContent = text;
    scroll.textContent = '';
  }
}

function activateTitleScroll(el) {

  const textWidth = span.offsetWidth;
  const boxWidth = el.offsetWidth;

  span.style.setProperty('--start-x', `${boxWidth}px`);
  span.style.setProperty('--end-x', `-${textWidth}px`);
  span.style.setProperty('--scroll-duration', `${duration}s`);

}

function setBlack(target, on) {

function calcStepsToLimit(current, limit, step) {
  if (current > limit) return 0;
  return Math.floor((limit - current) / step) + 1;
}

const FLIP_MS = 100;
function getCurrentValue(el) {
  const text = el.querySelector('.flap.main')?.textContent;
  const n = parseInt(text, 10);
  return isNaN(n) ? 0 : n;
}


function calcPreBlackTotalSteps(cell) {
  const hhNow  = getCurrentValue(cell.hh);
  const mmNow  = getCurrentValue(cell.mm);
  const durNow = getCurrentValue(cell.dur);

  const hhSteps  = Math.max(0, Math.floor((26 - hhNow) / 1) + 1);
  const mmSteps  = Math.max(0, Math.floor((59 - mmNow) / 1) + 1);
  const durSteps = Math.max(0, Math.floor((180 - durNow) / 5) + 1);

  // 一番長いセルに全体を合わせる
  return Math.max(hhSteps, mmSteps, durSteps);
}

async function flipBlack(el, durationMs) {
  el.classList.add('black');

  const end = Date.now() + durationMs;
  let v = 0;

  while (Date.now() < end) {
    await flipFlap(el, safe2(v % 100));
    v++;
  }
}
async function flipUntilLimitWithBlack(el, start, limit, step, totalSteps) {
  let v = start;
  let steps = 0;

  // ① 上限まで通常回転
  while (v <= limit && steps < totalSteps) {
    await flipFlap(el, safe2(v), FLIP_MS);
    v += step;
    steps++;
  }

  // ② 残りは黒回転
  while (steps < totalSteps) {
    el.classList.add('black');
    await flipFlap(el, safe2(Math.floor(Math.random() * 99)), FLIP_MS);
    steps++;
  }
}

  const totalSteps = calcPreBlackTotalSteps(cell);
  const A = totalSteps * FLIP_MS;

  await Promise.all([
    flipUntilLimitWithBlack(
      cell.hh,
      getCurrentValue(cell.hh),
      26,
      1,
      totalSteps
    ),
    flipUntilLimitWithBlack(
      cell.mm,
      getCurrentValue(cell.mm),
      59,
      1,
      totalSteps
    ),
    flipUntilLimitWithBlack(
      cell.dur,
      getCurrentValue(cell.dur),
      180,
      5,
      totalSteps
    ),
    spinRandomTitlesSteps(cell.title, totalSteps)
  ]);

}

/*目標値までのステップ数計算*/

function calcRevealSteps(targetValue, step) {
  if (targetValue <= 0) return 1;
  return Math.floor(targetValue / step) + 1;
}


/*ステップ制御型*/
async function flipUntilTarget(el, target, step, totalSteps) {
  let v = 0;
  let steps = 0;

  while (steps < totalSteps) {
    if (v <= target) {
      await flipFlap(el, safe2(v), FLIP_MS);
      v += step;
    } else {
      // 目標到達後は何もしない（表示固定）
      await sleep(FLIP_MS);
    }
    steps++;
  }

  setCellText(el, safe2(target));
}


async function revealSequence(target, data) {
  const cell = cells[target];
  setBlack(target, false);

  const [h, m] = data.startTime.split(':').map(Number);
  const d = data.durationMin;

  // ① 各セルの必要ステップ
  const hhSteps  = calcRevealSteps(h, 1);
  const mmSteps  = calcRevealSteps(m, 1);
  const durSteps = calcRevealSteps(d, 5);

  // ② 最大ステップ数に同期
  const totalSteps = Math.max(hhSteps, mmSteps, durSteps);
  const totalDuration = totalSteps * FLIP_MS;

  await Promise.all([
    flipUntilTarget(cell.hh, h, 1, totalSteps),
    flipUntilTarget(cell.mm, m, 1, totalSteps),
    flipUntilTarget(cell.dur, d, 5, totalSteps),
    spinRandomTitlesSteps(cell.title, totalSteps)
  ]);

  setTitle(cell.title, data.title);
  activateTitleScroll(cell.title);
  updateNotesBoard();
}

  await sleep(1200);

  if (displayData.next2) {
    await revealSequence('next2', displayData.next2, 2000);
  }

  flipping = false;
}

  el.dataset.currentText = text;

    span.style.animation = 'blinkRed 1s step-start infinite';

    span.style.color = '#00ff66';
  }

  el.appendChild(span);

  requestAnimationFrame(() => {
    if (isAlert) return;
    if (!text || text === '---') return;

    const textWidth = span.offsetWidth;
    const boxWidth = el.offsetWidth;
    const speed = 120;
    const distance = boxWidth + textWidth;
    const duration = distance / speed;

    span.style.setProperty('--start-x', `${boxWidth}px`);
    span.style.setProperty('--end-x', `-${textWidth}px`);
    span.style.setProperty('--scroll-duration', `${duration}s`);

    span.style.animation = `scrollText var(--scroll-duration) linear infinite`;
  });
}

// デフォルト表示日
function getDefaultDayIndex() {
  const today = new Date();
  today.setHours(0, 0, 0, 0); // ★ 時刻リセット

  for (let i = 0; i < timetableDays.length; i++) {
    const d = timetableDays[i];
    const date = new Date(d.year, d.month - 1, d.day);
    date.setHours(0, 0, 0, 0); // ★ これも必須

    if (today.getTime() === date.getTime()) return i; // 今日なら即決定
    if (today < date) return i; // 未来日ならそこ
  }

  return timetableDays.length - 1; // 全部過去なら最終日
}

// 1日分描画
function renderDay() {
  const day = timetableDays[dayIndex];

  document.getElementById('ttDate').textContent =
    `${day.month}月${day.day}日`;

  const tbody = document.querySelector('#timetable tbody');
  tbody.innerHTML = '';

  // ===== 表示用に並び替え =====
  const sortedRows = [...day.rows].sort((a, b) => {
    const aEnded = a.startTime === '上映終了' || a.startTime === '上映中止';
    const bEnded = b.startTime === '上映終了' || b.startTime === '上映中止';

    // 上映終了は必ず後ろ
    if (aEnded && !bEnded) return 1;
    if (!aEnded && bEnded) return -1;

    // 両方時刻あり → 時刻比較
    if (!aEnded && !bEnded) {
      return a.startTime.localeCompare(b.startTime);
    }

    return 0;
  });

  sortedRows.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${row.startTime}</td>
      <td>約${row.duration}分</td>
      <td class="tt-title" data-workid="${row.workId || ''}">
      ${row.title}
      </td>
      <td>${row.caution || ''}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('ttNotes').innerHTML = `
    <p>A＝お子様でもお楽しみいただけます</p>
    <p>B＝流血描写を含みます　観覧の際はご注意ください</p>
    <p>C＝飲酒や喫煙の描写を含みます　観覧の際はご注意ください</p>
    <p>D＝災害描写を含みます　観覧の際はご注意ください</p>
    <p>E＝一般のお客様はご覧いただけません</p>
  `;
}

  if (dayIndex <= 0) return;
  dayIndex--;
  renderDay();
  updateDayButtons();
};

document.getElementById('nextDay').onclick = () => {
  if (dayIndex >= timetableDays.length - 1) return;
  dayIndex++;
  renderDay();
  updateDayButtons();
};

function updateDayButtons() {
  setDayButton('prevDay', dayIndex > 0);
  setDayButton('nextDay', dayIndex < timetableDays.length - 1);
}

function setDayButton(id, enabled) {
  const btn = document.getElementById(id);
  btn.disabled = !enabled;
  btn.classList.toggle('enabled', enabled);
  btn.classList.toggle('disabled', !enabled);
}

/**
 * 表示用にデータを整形
 */
function normalizeWorkData(data) {
  if (!data) return null;
  const imageUrl = data.image || '';

  const imageType =
    /\.pdf$/i.test(imageUrl)
      ? 'pdf'
      : imageUrl
        ? 'image'
        : null;

  return {
    ...data,

    // 所要時間 → 約○○分
    durationText:
      data.duration
        ? `所要時間：約${data.duration}分`
        : '',

    // 新作 / 過去作
    badgeText:
      data.category === '新作'
        ? '新作'
        : data.category === '過去作'
          ? '過去作'
          : '',

    // 画像種別判定
    imageType
  };
}


/**
 * モーダルを開く
 */

function openWorkModal(workId) {
  if (!workId) return;

  document.body.classList.add('modal-open');
  document.getElementById('modal').classList.remove('hidden');

  if (workDetailCache[workId]) {
    showModal(workDetailCache[workId]);
    return;
  }

  openModalSkeleton();

  callGAS('getWorkDetail', { workId })
    .then(res => {
      if (!res) {
        closeModal();
        return;
      }
      workDetailCache[workId] = res;
      showModal(res);
    })
    .catch(err => {
      console.error(err);
      closeModal();
    });
}




/**
 * モーダルを閉じる
 */
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.body.classList.remove('modal-open');
}

/**
 * skeleton 表示
 */
function openModalSkeleton() {
  document.getElementById('modalTitle').textContent = '読み込み中…';
  document.getElementById('modalRuby').textContent = '';
  document.getElementById('modalCategory').textContent = '';
  document.getElementById('modalDesc').textContent = '';
  document.getElementById('modalCaution').innerHTML = '';
  document.getElementById('modalNote').textContent = '';
  document.getElementById('modalDuration').textContent = '';
  document.getElementById('modalBadge').textContent = '';

  document.getElementById('modalImage').classList.add('hidden');
  document.getElementById('modalPdf').classList.add('hidden');
  document.getElementById('modalImageSvg').innerHTML = '';
}


/**
 * モーダル内容描画
 */
function showModal(rawData) {
  const data = normalizeWorkData(rawData);
  const modalImage = document.getElementById('modalImage');
  const zoomClose = document.getElementById('imageZoomClose');
  const modalBody = document.querySelector('.modal-body');
  console.log('image url =', data.image);
  console.log('imageType =', data.imageType);
  if (!data) return;

  
  /* ★ 拡大状態を必ず初期化 */
  modalImage.classList.remove('zoomed');
  zoomClose.classList.add('hidden');
  modalBody.style.overflow = 'auto';

  // ===== テキスト =====
  modalTitle.textContent = data.title || '';
  modalRuby.textContent = data.ruby ? `（${data.ruby}）` : '';
  modalDesc.textContent = data.description || '';
  modalNote.textContent = data.notes || '';
  modalDuration.textContent = data.durationText || '';

  // ===== バッジ =====
  modalBadge.textContent = '';
  modalBadge.className = 'badge';

  if (data.badgeText) {
    modalBadge.textContent = data.badgeText;
    modalBadge.classList.add(
      data.category === '新作' ? 'badge-new' : 'badge-archive'
    );
  }

  // ===== 注意 =====
  modalCaution.innerHTML = '';
  (data.cautions || []).forEach(t => {
    const p = document.createElement('p');
    p.textContent = t;
    modalCaution.appendChild(p);
  });

  // ===== 画像 / PDF =====
  modalImage.classList.add('hidden');
  modalPdf.classList.add('hidden');
  modalImageSvg.innerHTML = '';
  modalImage.src = '';
  modalPdf.src = '';

  if (!data.imageType) return;

  if (data.imageType === 'pdf') {
    modalPdf.src = data.image;
    modalPdf.classList.remove('hidden');
  } else {
    modalImage.src = data.image;
    modalImage.classList.remove('hidden');
  }
    // ★ 拡大状態を必ずリセット
    modalImage.classList.remove('zoomed');
    zoomClose.classList.add('hidden');
    modalBody.style.overflow = 'auto';
}

document.getElementById('modalBack').addEventListener('click', closeModal);

function renderButtons(buttons) {

  area.style.display = 'flex';
  area.innerHTML = '';

  buttons.forEach(btn => {
    const a = document.createElement('a');
    a.textContent = btn.name;
    a.href = btn.url;
    a.target = btn.target || '_blank';
    a.rel = 'noopener';
    a.className = 'action-button';
    area.appendChild(a);
  });
